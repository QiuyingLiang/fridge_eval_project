name: Build DXReview

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name DXReview --paths=. tools/run.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: DXReview
        path: dist/DXReview.exe
